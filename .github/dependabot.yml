# Dependabot keeps the GitHub Actions in .github/workflows up to date.
# This site is plain HTML/CSS/JS with no package manager, so there is no npm entry;
# check the Font Awesome CDN version in index.html by hand.
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "09:00"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 5
